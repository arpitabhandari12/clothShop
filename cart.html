<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clothing Store | Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <img src="assets/images/luck.png" alt="" width="40px">
            <a class="navbar-brand mx-3" href="index.html">TrendzonStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link active" href="aboutus.html">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="row mt-5"></div>
    <!-- Cart Header -->
    <header class="bg-dark text-white text-center py-5"
        style="background-image: url('https://media.istockphoto.com/id/1417392204/vector/abstract-background-the-studio-space-is-empty-with-a-smooth-and-soft-brown-color.jpg?s=612x612&w=0&k=20&c=mhY6o_kRsPvAV-RgN0balNY3yKvz-ew3HVCl4SXg0Hw=');">
        <div class="container">
            <h1 class="display-4">Your Shopping Cart</h1>
            <p class="lead">Review your items before checkout</p>
        </div>
    </header>

    <!-- Cart Items -->
    <section class="py-5">
        <div class="container">
            <div id="cart-items" class="table-responsive">
                <!-- Cart Table will be injected here by JS -->
            </div>
            <div id="empty-cart" class="text-center">
                <p class="lead">Your cart is empty.</p>
            </div>
            <div class="text-end">
                <h3>Total: $<span id="total-price">0.00</span></h3>
                <button class="btn btn-primary" id="checkout-btn" disabled>Proceed to Checkout</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 fixed-bottom">
        <div class="container">
            <p class="mb-1">&copy; 2025 TrendzonStore. All rights reserved.</p>
            <p class="small">Follow us on
                <a href="#" class="text-white text-decoration-underline">Instagram</a>,
                <a href="#" class="text-white text-decoration-underline">Facebook</a>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
</body>

</html>
